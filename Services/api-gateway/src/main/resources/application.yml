server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: users-service
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${AUTH_RATE_LIMIT:10}
                    redis-rate-limiter.burstCapacity: ${AUTH_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: usersCircuitBreaker
                    fallbackUri: forward:/fallback/users
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                - name: RequestSize
                  args:
                    maxSize: ${MAX_REQUEST_BYTES:1048576}
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/catalog/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GENERAL_RATE_LIMIT:50}
                    redis-rate-limiter.burstCapacity: ${GENERAL_BURST_CAPACITY:100}
                    key-resolver: "#{@ipKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    fallbackUri: forward:/fallback/catalog
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
            - id: cart-health
              uri: ${CART_SERVICE_URL:http://localhost:3001}
              predicates:
                - Path=/api/v1/cart/health
              filters:
                - RewritePath=/api/v1/cart/health, /health

            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:3001}
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - RewritePath=/api/v1/cart(?<segment>/?.*), /api/cart${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GENERAL_RATE_LIMIT:50}
                    redis-rate-limiter.burstCapacity: ${GENERAL_BURST_CAPACITY:100}
                    key-resolver: "#{@ipKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: cartCircuitBreaker
                    fallbackUri: forward:/fallback/cart
                - name: RequestSize
                  args:
                    maxSize: ${MAX_REQUEST_BYTES:1048576}

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowedHeaders: '*'
                allowCredentials: true
                maxAge: 3600

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    issuer-uri: ${JWT_ISSUER_URI:}
